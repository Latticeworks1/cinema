[package]
name = "cinema-runtime"
description = "Setup/edit/run API: open a packet, inspect and edit its resolved direction config, preview a single frame of either pass, and export, all without touching Rust source."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
direct = { workspace = true }
packet = { workspace = true }
track = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "cinema_runtime"
path = "src/lib.rs"
doctest = false
